<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#162b3b">
<title>写真報告書メーカー</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f7;--card:#fff;--ink:#17212b;--muted:#66727d;--line:#d8e0e6;
  --navy:#162b3b;--navy2:#24465d;--soft:#eaf0f4;
  --red:#c5221f;--red-soft:#fff0ef;--orange:#b45f06;--orange-soft:#fff5e7;
  --green:#18794e;--green-soft:#e9f7f0;--yellow:#8a6200;--yellow-soft:#fff8d9;
  --shadow:0 8px 26px rgba(24,40,52,.07);--r:16px;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:30;background:rgba(243,245,247,.95);backdrop-filter:blur(13px);border-bottom:1px solid var(--line);padding:12px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:center;gap:12px}.header h1{margin:0;font-size:18px}.eyebrow{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:2px}.page{max-width:980px;margin:0 auto;padding:16px 12px 90px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.hero{background:linear-gradient(135deg,#162b3b,#284c63);color:#fff;border:0}.hero h2{font-size:25px;line-height:1.3;margin:4px 0 8px}.hero p{margin:0 0 16px;opacity:.82;line-height:1.6}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label,.label{font-size:13px;font-weight:800}.field input,.field select,.field textarea,input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;min-height:44px;padding:9px 11px;color:var(--ink)}textarea{resize:vertical;min-height:78px}.help{font-size:12px;color:var(--muted);line-height:1.55}.btn{border:1px solid transparent;border-radius:12px;min-height:44px;padding:9px 13px;font-weight:800}.btn.primary{background:var(--navy);color:#fff}.btn.secondary{background:var(--soft);color:var(--navy);border-color:#cdd9e0}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn.danger{background:var(--red-soft);color:var(--red);border-color:#f0c7c4}.btn.small{min-height:34px;padding:6px 9px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.sticky{position:sticky;bottom:0;z-index:25;margin:14px -6px -10px;padding:11px 6px calc(11px + env(safe-area-inset-bottom));background:rgba(243,245,247,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.status.notstarted{background:#eef1f3;color:#61707c}.status.before,.status.progress{background:var(--red-soft);color:var(--red)}.status.review{background:var(--yellow-soft);color:var(--yellow)}.status.done{background:var(--green-soft);color:var(--green)}
.sectionTitle{font-size:18px;font-weight:900;margin:0 0 10px}.propertyGroup{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:#fff}.propertyHead{padding:13px 14px;background:#f8fafb;font-weight:900;display:flex;justify-content:space-between;align-items:center}.historyRow{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.historyTitle{font-weight:850}.historySub{font-size:12px;color:var(--muted);margin-top:3px}.dateDivider{font-size:12px;font-weight:900;color:var(--muted);background:#f2f5f7;padding:6px 14px;border-top:1px solid var(--line)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:10px 11px}.check input{width:20px;height:20px}.basicPanel{border:1px solid var(--line);border-radius:15px;overflow:hidden}.basicHead{padding:12px 13px;background:#f8fafb;display:flex;justify-content:space-between;align-items:center;gap:8px}.progressBar{height:7px;background:#e8edf0;border-radius:999px;overflow:hidden;margin-top:8px}.progressBar>span{display:block;height:100%;background:var(--navy2)}
.slotTable{display:grid}.slotRow{display:grid;grid-template-columns:110px 1fr 1fr;border-top:1px solid var(--line);min-height:136px}.slotName{display:flex;align-items:center;padding:10px;font-weight:900;background:#fbfcfd}.slot{padding:8px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}.slotLabel{font-size:11px;font-weight:900;color:var(--muted)}.slotLabel.after{color:var(--navy2)}.photoBox{position:relative;flex:1;min-height:86px;border:1.5px dashed #bdc8cf;border-radius:11px;background:#f9fbfc;display:flex;align-items:center;justify-content:center;overflow:hidden}.photoBox.has{border-style:solid;background:#fff}.photoBox img{width:100%;height:100%;min-height:86px;max-height:150px;object-fit:cover;display:block}.photoBox input{display:none}.photoAdd{width:100%;height:100%;min-height:86px;border:0;background:transparent;color:var(--navy);font-weight:900}.photoActions{display:flex;gap:5px}.photoActions .btn{flex:1}.warnIcon{position:absolute;top:5px;right:5px;background:var(--yellow-soft);color:var(--yellow);border:1px solid #eadb8d;border-radius:999px;padding:3px 6px;font-size:10px;font-weight:900}.bulkButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.bulkButtons input{display:none}.notice{border-radius:12px;padding:11px 12px;background:var(--soft);color:var(--navy);font-size:12px;line-height:1.55}.notice.warn{background:var(--yellow-soft);color:#6d5300}.notice.danger{background:var(--red-soft);color:var(--red)}.reviewList{display:grid;gap:8px}.reviewItem{padding:11px 12px;border:1px solid var(--line);border-radius:12px}.reviewItem.warn{background:var(--yellow-soft);border-color:#eadb8d}.reviewItem.ok{background:var(--green-soft);border-color:#c3e5d2}.reviewItem strong{display:block;margin-bottom:3px}.reviewItem p{margin:0;font-size:12px;line-height:1.5}.confirmCheck{display:flex;align-items:flex-start;gap:9px;margin-top:8px;font-size:13px}.confirmCheck input{width:20px;height:20px;margin-top:0}
.previewShell{background:#dce2e6;padding:12px;border-radius:14px;overflow:auto}.paper{width:min(100%,794px);margin:0 auto;background:#fff;color:#111;padding:15mm 13mm 14mm;box-shadow:0 4px 18px rgba(0,0,0,.1)}.pdfTitle{font-size:22px;font-weight:900;border-bottom:3px solid #1d3b50;padding-bottom:7px;margin-bottom:9px}.pdfMeta{display:grid;grid-template-columns:1fr 1fr;border:1px solid #555;margin-bottom:13px}.pdfMeta div{padding:6px 8px;font-size:12px;border-bottom:1px solid #bbb}.pdfMeta div:nth-last-child(-n+2){border-bottom:0}.pdfSection{margin-top:15px}.pdfSection h3{font-size:15px;margin:0 0 7px;background:#eef2f5;padding:6px 8px;border-left:4px solid #1d3b50}.pdfPair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;break-inside:avoid}.pdfCell{border:1px solid #aaa;padding:5px}.pdfCellLabel{font-size:10px;font-weight:900;margin-bottom:4px;display:flex;justify-content:space-between}.pdfCell img{display:block;width:100%;height:165px;object-fit:contain;background:#fafafa}.pdfRoom{font-size:11px;color:#444}.toast{position:fixed;z-index:100;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;background:#17212b;color:#fff;border-radius:999px;padding:10px 15px;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
@media(max-width:680px){.grid2,.checks{grid-template-columns:1fr}.slotRow{grid-template-columns:84px 1fr 1fr}.slotName{font-size:13px;padding:7px}.slot{padding:5px}.photoBox,.photoAdd{min-height:76px}.photoBox img{min-height:76px;max-height:115px}.bulkButtons{grid-template-columns:1fr}.historyRow{grid-template-columns:1fr}.historyRow .row .btn{flex:1}.paper{padding:10mm 7mm}.pdfPair{gap:5px}.pdfCell img{height:135px}.pdfMeta{grid-template-columns:1fr}.pdfMeta div:nth-last-child(-n+2){border-bottom:1px solid #bbb}.pdfMeta div:last-child{border-bottom:0}}
@media print{body{background:#fff}.header,.noPrint,.toast{display:none!important}.page{max-width:none;padding:0}.previewShell{padding:0;background:#fff}.paper{width:100%;box-shadow:none;margin:0;padding:8mm}.pdfCell img{height:58mm}}
</style>
</head>
<body>
<header class="header"><div><div class="eyebrow">CO-OP CLEANING CHECK</div><h1>写真報告書メーカー</h1></div><button id="homeBtn" class="btn ghost small">ホーム</button></header>
<main id="view" class="page"></main><div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<script>
(()=>{
'use strict';
const DB='photo-report-maker-db-v2', VER=1, S={properties:'properties',reports:'reports',photos:'photos'};
const BASIC=['ベランダ','居室','台所','トイレ','風呂','玄関'];
let db,current=null,urls=new Map(),aiModel=null,aiLoading=null;
const view=document.getElementById('view'),toast=document.getElementById('toast');
const nowISO=()=>new Date().toISOString();
const uid=(p='id')=>`${p}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
const dateISO=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${y}年${+m}月${+d}日`};
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),1800)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(S.properties))d.createObjectStore(S.properties,{keyPath:'id'});if(!d.objectStoreNames.contains(S.reports))d.createObjectStore(S.reports,{keyPath:'id'});if(!d.objectStoreNames.contains(S.photos)){const x=d.createObjectStore(S.photos,{keyPath:'id'});x.createIndex('reportId','reportId')}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const store=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const put=(n,o)=>new Promise((res,rej)=>{const r=store(n,'readwrite').put(o);r.onsuccess=()=>res(o);r.onerror=()=>rej(r.error)});
const one=(n,k)=>new Promise((res,rej)=>{const r=store(n).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const all=n=>new Promise((res,rej)=>{const r=store(n).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});
const del=(n,k)=>new Promise((res,rej)=>{const r=store(n,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
function reportPhotos(rid){return new Promise((res,rej)=>{const t=db.transaction(S.photos),q=t.objectStore(S.photos).index('reportId').getAll(rid);q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function seed(){if((await all(S.properties)).length===0)await put(S.properties,{id:uid('prop'),name:'サンプルマンション',address:'',items:['基本清掃','家具家電対応','給水部品修理','台所床鳴り補修','玄関床CF'],createdAt:nowISO()})}
function revoke(){urls.forEach(URL.revokeObjectURL);urls.clear()}
async function purl(id){if(!id)return'';if(urls.has(id))return urls.get(id);const p=await one(S.photos,id);if(!p)return'';const u=URL.createObjectURL(p.blob);urls.set(id,u);return u}
function makeBasic(){return BASIC.map(name=>({name,beforeId:null,afterId:null,beforeCheck:null,afterCheck:null,pairCheck:null}))}
function makeItem(name){return {id:uid('item'),name,type:name==='基本清掃'?'basic':'generic',zones:name==='基本清掃'?makeBasic():null,beforeId:null,afterId:null,beforeCheck:null,afterCheck:null,pairCheck:null}}
function statusInfo(r){
 const slots=[];(r.items||[]).forEach(i=>{if(i.type==='basic')i.zones.forEach(z=>slots.push([z.beforeId,z.afterId]));else slots.push([i.beforeId,i.afterId])});
 if(!slots.length)return{key:'notstarted',label:'未着手',done:0,total:0};
 const total=slots.length*2,filled=slots.reduce((n,p)=>n+(p[0]?1:0)+(p[1]?1:0),0),before=slots.reduce((n,p)=>n+(p[0]?1:0),0),after=slots.reduce((n,p)=>n+(p[1]?1:0),0);
 const warnings=countWarnings(r);
 if(filled===0)return{key:'notstarted',label:'未着手',done:0,total};
 if(filled===total){if(r.reviewConfirmed)return{key:'done',label:'完了',done:filled,total};return warnings?{key:'review',label:'要確認',done:filled,total}:{key:'done',label:'完了',done:filled,total};}
 if(after===0&&before>0)return{key:'before',label:'作業前',done:filled,total};
 return{key:'progress',label:'作業中',done:filled,total};
}
function countWarnings(r){let n=0;(r.items||[]).forEach(i=>{const xs=i.type==='basic'?i.zones:[i];xs.forEach(x=>{if(x.beforeCheck?.warn)n++;if(x.afterCheck?.warn)n++;if(x.pairCheck?.warn)n++})});return n}
async function save(){current.updatedAt=nowISO();await put(S.reports,current)}
function statusBadge(r){const s=statusInfo(r);return `<span class="status ${s.key}">${s.label}${s.total?` ${s.done}/${s.total}`:''}</span>`}
async function home(){current=null;revoke();const [props,reps]=await Promise.all([all(S.properties),all(S.reports)]);reps.sort((a,b)=>(b.workDate||'').localeCompare(a.workDate||'')||(b.updatedAt||'').localeCompare(a.updatedAt||''));const groups=props.map(p=>({p,reps:reps.filter(r=>r.propertyId===p.id)}));view.innerHTML=`
<section class="card hero"><div class="eyebrow" style="color:#cfe0ea">繁忙期向け</div><h2>撮る → 確認 → 完成。<br>入力はできるだけ自動化。</h2><p>マンション・部屋・日付で整理。基本清掃は6か所×作業前後を固定枠で管理します。</p><div class="row"><button id="newBtn" class="btn primary" style="background:#fff;color:#162b3b">＋ 新しい作業</button><button id="propBtn" class="btn secondary">マンション設定</button></div></section>
<section class="card"><div class="between"><h2 class="sectionTitle">マンション別</h2><span class="help">${reps.length}件</span></div>${groups.map(g=>`<div class="propertyGroup"><div class="propertyHead"><span>${esc(g.p.name)}</span><span class="help">${g.reps.length}件</span></div>${g.reps.length?groupDates(g.reps):'<div class="historyRow"><div class="help">まだ作業データがありません。</div></div>'}</div>`).join('')}</section>`;
 document.getElementById('newBtn').onclick=newStart;document.getElementById('propBtn').onclick=templates;document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openReport(b.dataset.id));document.querySelectorAll('.trash').forEach(b=>b.onclick=()=>deleteReport(b.dataset.id));}
function groupDates(reps){const m={};reps.forEach(r=>(m[r.workDate]??=[]).push(r));return Object.keys(m).sort().reverse().map(d=>`<div class="dateDivider">${fmtDate(d)}</div>${m[d].map(r=>`<div class="historyRow"><div><div class="historyTitle">${esc(r.room||'部屋番号未入力')}　${statusBadge(r)}</div><div class="historySub">${(r.items||[]).map(i=>esc(i.name)).join(' ／ ')}</div></div><div class="row"><button class="btn ghost small open" data-id="${r.id}">開く</button><button class="btn danger small trash" data-id="${r.id}">削除</button></div></div>`).join('')}`).join('')}
async function newStart(){const props=(await all(S.properties)).sort((a,b)=>a.name.localeCompare(b.name,'ja'));view.innerHTML=`<section class="card"><h2 class="sectionTitle">新しい作業</h2><div class="grid2"><div class="field"><label>マンション</label><select id="pSel"><option value="">選択</option>${props.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>部屋番号</label><input id="room" type="text" inputmode="numeric" placeholder="例：1516"></div><div class="field"><label>作業日</label><input id="date" type="date" value="${dateISO()}"></div></div><div class="sticky"><button class="btn ghost" id="cancel">戻る</button><button class="btn primary" id="next">次へ</button></div></section>`;document.getElementById('cancel').onclick=home;document.getElementById('next').onclick=async()=>{const pid=document.getElementById('pSel').value,room=document.getElementById('room').value.trim(),date=document.getElementById('date').value;if(!pid)return say('マンションを選択してください');if(!room)return say('部屋番号を入力してください');const p=await one(S.properties,pid);current={id:uid('report'),propertyId:p.id,propertyName:p.name,room,workDate:date,createdAt:nowISO(),updatedAt:nowISO(),templateItems:[...(p.items||[])],items:[],reviewConfirmed:false};await save();chooseItems()}}
function chooseItems(){const selected=new Set(current.items.map(i=>i.name));view.innerHTML=`<section class="card"><div class="between"><h2 class="sectionTitle">作業項目</h2>${statusBadge(current)}</div><div class="help" style="margin-bottom:10px">${esc(current.propertyName)} ${esc(current.room)}号室 ・ ${fmtDate(current.workDate)}</div><div class="checks" id="checks">${(current.templateItems||[]).map(n=>`<label class="check"><input type="checkbox" value="${esc(n)}" ${selected.has(n)?'checked':''}><span>${esc(n)}${n==='基本清掃'?'<div class="help">6か所 × 作業前後</div>':''}</span></label>`).join('')}</div><div class="field" style="margin-top:12px"><label>その他の項目</label><div class="row"><input id="custom" type="text" placeholder="例：浴室コーキング補修" style="flex:1"><button id="add" class="btn secondary">追加</button></div></div><div class="sticky"><button id="back" class="btn ghost">戻る</button><button id="go" class="btn primary">撮影画面へ</button></div></section>`;
 document.getElementById('back').onclick=home;document.getElementById('add').onclick=()=>{const n=document.getElementById('custom').value.trim();if(!n)return;if(!current.templateItems.includes(n))current.templateItems.push(n);if(!current.items.some(i=>i.name===n))current.items.push(makeItem(n));chooseItems()};document.getElementById('go').onclick=async()=>{const names=[...document.querySelectorAll('#checks input:checked')].map(x=>x.value);if(!names.length)return say('作業項目を選択してください');const existing=new Map(current.items.map(i=>[i.name,i]));current.items=names.map(n=>existing.get(n)||makeItem(n));current.reviewConfirmed=false;current.completedAt=null;await save();capture()}}
async function capture(){revoke();const s=statusInfo(current);let html='';for(const item of current.items){if(item.type==='basic')html+=await basicHTML(item);else html+=await genericHTML(item)}view.innerHTML=`<section class="card"><div class="between"><div><h2 class="sectionTitle">${esc(current.propertyName)} ${esc(current.room)}号室</h2><div class="help">${fmtDate(current.workDate)}</div></div>${statusBadge(current)}</div><div class="notice ${s.key==='before'||s.key==='progress'?'danger':''}" style="margin-top:10px">作業前・作業中はPDFにしません。必要写真が揃ったら最終確認へ進みます。</div></section>${html}<div class="sticky"><button id="itemsBack" class="btn ghost">項目</button><button id="review" class="btn primary">最終確認</button></div>`;bindCapture();document.getElementById('itemsBack').onclick=chooseItems;document.getElementById('review').onclick=review;}
async function basicHTML(item){let rows='';for(let i=0;i<item.zones.length;i++){const z=item.zones[i],bu=await purl(z.beforeId),au=await purl(z.afterId);rows+=`<div class="slotRow"><div class="slotName">${esc(z.name)}</div>${slotHTML(item.id,'basic',i,'before',z.beforeId,bu,z.beforeCheck)}${slotHTML(item.id,'basic',i,'after',z.afterId,au,z.afterCheck)}</div>`}const done=item.zones.reduce((n,z)=>n+(z.beforeId?1:0)+(z.afterId?1:0),0);return `<section class="card"><div class="basicPanel"><div class="basicHead"><div><strong>基本清掃</strong><div class="help">ベランダ → 居室 → 台所 → トイレ → 風呂 → 玄関</div></div><strong>${done}/12</strong></div><div class="progressBar"><span style="width:${done/12*100}%"></span></div><div class="bulkButtons" style="padding:0 12px 12px"><label class="btn secondary" style="text-align:center">作業前をまとめて登録<input class="bulk" data-item="${item.id}" data-phase="before" type="file" accept="image/*" multiple></label><label class="btn secondary" style="text-align:center">作業後をまとめて登録<input class="bulk" data-item="${item.id}" data-phase="after" type="file" accept="image/*" multiple></label></div><div class="slotTable">${rows}</div></div></section>`}
async function genericHTML(item){const bu=await purl(item.beforeId),au=await purl(item.afterId);return `<section class="card"><div class="between"><h3 class="sectionTitle" style="font-size:16px">${esc(item.name)}</h3><span class="help">作業前 / 作業後</span></div><div class="slotRow" style="grid-template-columns:110px 1fr 1fr"><div class="slotName">${esc(item.name)}</div>${slotHTML(item.id,'generic',-1,'before',item.beforeId,bu,item.beforeCheck)}${slotHTML(item.id,'generic',-1,'after',item.afterId,au,item.afterCheck)}</div></section>`}
function slotHTML(itemId,type,zone,phase,pid,url,check){const id=`f_${itemId}_${zone}_${phase}`;return `<div class="slot"><div class="slotLabel ${phase==='after'?'after':''}">${phase==='before'?'作業前':'作業後'}</div><div class="photoBox ${pid?'has':''}">${check?.warn?'<span class="warnIcon">要確認</span>':''}${pid?`<img src="${url}">`:`<button class="photoAdd" data-for="${id}">＋ 写真</button>`}<input id="${id}" class="slotFile" data-item="${itemId}" data-type="${type}" data-zone="${zone}" data-phase="${phase}" type="file" accept="image/*"></div>${pid?`<div class="photoActions"><button class="btn ghost small replace" data-for="${id}">差替</button><button class="btn danger small clear" data-item="${itemId}" data-type="${type}" data-zone="${zone}" data-phase="${phase}">削除</button></div>`:''}</div>`}
function bindCapture(){document.querySelectorAll('.photoAdd,.replace').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.for).click());document.querySelectorAll('.slotFile').forEach(i=>i.onchange=()=>slotUpload(i));document.querySelectorAll('.clear').forEach(b=>b.onclick=()=>clearSlot(b));document.querySelectorAll('.bulk').forEach(i=>i.onchange=()=>bulkUpload(i))}
async function saveBlob(file){const pid=uid('photo');await put(S.photos,{id:pid,reportId:current.id,blob:file,name:file.name||'',createdAt:nowISO()});return pid}
function target(item,type,zone){return type==='basic'?item.zones[+zone]:item}
async function slotUpload(input){const f=input.files?.[0];if(!f)return;const item=current.items.find(x=>x.id===input.dataset.item),t=target(item,input.dataset.type,input.dataset.zone),phase=input.dataset.phase;const old=t[phase+'Id'];if(old)await del(S.photos,old);t[phase+'Id']=await saveBlob(f);t[phase+'Check']=null;t.pairCheck=null;current.reviewConfirmed=false;current.completedAt=null;await save();await capture();say('写真を登録しました')}
async function clearSlot(b){const item=current.items.find(x=>x.id===b.dataset.item),t=target(item,b.dataset.type,b.dataset.zone),phase=b.dataset.phase,id=t[phase+'Id'];if(id)await del(S.photos,id);t[phase+'Id']=null;t[phase+'Check']=null;t.pairCheck=null;current.reviewConfirmed=false;current.completedAt=null;await save();capture()}
async function bulkUpload(input){const files=[...input.files];if(!files.length)return;const item=current.items.find(x=>x.id===input.dataset.item);if(item.type!=='basic')return;const phase=input.dataset.phase;const empties=item.zones.filter(z=>!z[phase+'Id']);if(files.length>empties.length){say(`空きは${empties.length}枠です`);return}for(let i=0;i<files.length;i++){empties[i][phase+'Id']=await saveBlob(files[i]);empties[i][phase+'Check']=null;empties[i].pairCheck=null}current.reviewConfirmed=false;current.completedAt=null;await save();capture();say(`${files.length}枚を順番に登録しました`)}
async function review(){const s=statusInfo(current);if(s.done<s.total){await reviewIncomplete();return}view.innerHTML=`<section class="card"><div class="between"><h2 class="sectionTitle">最終確認</h2><span class="status review">チェック中</span></div><div class="notice">写真の抜け・前後の撮影場所・明らかなカテゴリ違いを確認します。AI判定は補助なので、最終判断は目視で行ってください。</div><div id="checking" class="notice warn" style="margin-top:9px">写真をチェックしています…</div></section>`;await runChecks();await renderReviewResults()}
async function reviewIncomplete(){const s=statusInfo(current);view.innerHTML=`<section class="card"><h2 class="sectionTitle">まだ完成していません</h2><div class="notice danger">現在は <strong>${s.label}</strong>（${s.done}/${s.total}枚）。作業前・作業中の状態では報告書PDFは作成しません。</div><div class="sticky"><button id="backCap" class="btn primary">撮影画面へ戻る</button></div></section>`;document.getElementById('backCap').onclick=capture}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function loadAI(){if(aiModel)return aiModel;if(aiLoading)return aiLoading;aiLoading=(async()=>{try{await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');aiModel=await mobilenet.load({version:2,alpha:0.5});return aiModel}catch(e){console.warn('AI load failed',e);return null}})();return aiLoading}
async function imageEl(pid){const u=await purl(pid);return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=u})}
function obviousCategory(preds){const text=preds.map(p=>p.className.toLowerCase()).join(' | '),top=preds[0]?.probability||0;if(top<.18)return null;const has=(...ks)=>ks.some(k=>text.includes(k));if(has('toilet seat','toilet tissue'))return'トイレ';if(has('bathtub','shower curtain','soap dispenser'))return'風呂';if(has('stove','microwave','dishwasher','refrigerator','frying pan','wok','pot','kitchen'))return'台所';return null}
async function classify(pid,expected){const model=await loadAI();if(!model)return{warn:false,note:'AI内容判定はネットワーク都合で省略しました'};try{const img=await imageEl(pid),preds=await model.classify(img,5),cat=obviousCategory(preds);if(cat&&expected&&cat!==expected)return{warn:true,note:`「${expected}」に登録されていますが、AIは「${cat}」の可能性を検出しました。`};return{warn:false,note:cat?`AI判定: ${cat}`:'明らかなカテゴリ違いは検出されませんでした'} }catch(e){return{warn:false,note:'AI内容判定を実行できませんでした'}}}
async function feature(pid){const img=await imageEl(pid),c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');x.drawImage(img,0,0,16,16);const d=x.getImageData(0,0,16,16).data,v=[];for(let i=0;i<d.length;i+=4)v.push((d[i]+d[i+1]+d[i+2])/3/255);const mean=v.reduce((a,b)=>a+b,0)/v.length;return v.map(n=>n-mean)}
function cosine(a,b){let ab=0,aa=0,bb=0;for(let i=0;i<a.length;i++){ab+=a[i]*b[i];aa+=a[i]*a[i];bb+=b[i]*b[i]}return ab/(Math.sqrt(aa*bb)||1)}
async function pairCheck(a,b){try{const [fa,fb]=await Promise.all([feature(a),feature(b)]),sim=cosine(fa,fb);return sim<.28?{warn:true,note:`作業前後の構図が大きく異なる可能性があります（類似度 ${Math.round(sim*100)}%）。`}:{warn:false,note:`前後の構図チェック: OK（類似度 ${Math.round(sim*100)}%）`}}catch{return{warn:false,note:'前後構図チェックを実行できませんでした'}}}
async function runChecks(){for(const item of current.items){const xs=item.type==='basic'?item.zones:[item];for(const x of xs){const expected=item.type==='basic'?x.name:null;if(x.beforeId)x.beforeCheck=await classify(x.beforeId,expected);if(x.afterId)x.afterCheck=await classify(x.afterId,expected);if(x.beforeId&&x.afterId)x.pairCheck=await pairCheck(x.beforeId,x.afterId)}}await save()}
async function renderReviewResults(){const rows=[];for(const item of current.items){const xs=item.type==='basic'?item.zones:[item];for(const x of xs){const label=item.type==='basic'?`基本清掃 / ${x.name}`:item.name;const notes=[['作業前',x.beforeCheck],['作業後',x.afterCheck],['前後比較',x.pairCheck]].filter(a=>a[1]);const warn=notes.some(a=>a[1].warn);rows.push(`<div class="reviewItem ${warn?'warn':'ok'}"><strong>${warn?'⚠':'✓'} ${esc(label)}</strong>${notes.map(a=>`<p>${a[0]}：${esc(a[1].note)}</p>`).join('')}</div>`)}}
 const warns=countWarnings(current);view.innerHTML=`<section class="card"><div class="between"><h2 class="sectionTitle">最終確認</h2>${warns?'<span class="status review">要確認</span>':'<span class="status done">問題なし</span>'}</div><div class="reviewList">${rows.join('')}</div>${warns?`<label class="confirmCheck"><input id="confirm" type="checkbox"><span>警告箇所を目視で確認しました。内容に問題がないことを確認して完成扱いにします。</span></label>`:`<label class="confirmCheck"><input id="confirm" type="checkbox" checked><span>写真の内容と並びを確認しました。</span></label>`}<div class="sticky"><button id="backCap" class="btn ghost">写真へ戻る</button><button id="complete" class="btn primary">報告書を完成</button></div></section>`;document.getElementById('backCap').onclick=capture;document.getElementById('complete').onclick=async()=>{if(!document.getElementById('confirm').checked)return say('確認チェックを入れてください');current.reviewConfirmed=true;current.completedAt=nowISO();await save();preview()}}
async function preview(){const s=statusInfo(current);if(s.done<s.total)return reviewIncomplete();if(!current.reviewConfirmed)return review();revoke();let sections='';for(const item of current.items){if(item.type==='basic'){let pairs='';for(const z of item.zones){pairs+=await pdfPair(z.name,z.beforeId,z.afterId)}sections+=`<section class="pdfSection"><h3>基本清掃</h3>${pairs}</section>`}else sections+=`<section class="pdfSection"><h3>${esc(item.name)}</h3>${await pdfPair(item.name,item.beforeId,item.afterId)}</section>`}view.innerHTML=`<section class="card noPrint"><div class="between"><h2 class="sectionTitle">完成プレビュー</h2><span class="status done">完了</span></div><div class="notice">完成状態のみPDF出力できます。</div></section><div class="previewShell"><article id="pdf" class="paper"><div class="pdfTitle">作業報告書</div><div class="pdfMeta"><div><strong>物件名</strong>　${esc(current.propertyName)}</div><div><strong>部屋</strong>　${esc(current.room)}号室</div><div><strong>作業日</strong>　${fmtDate(current.workDate)}</div><div><strong>作業項目</strong>　${current.items.map(i=>esc(i.name)).join(' / ')}</div></div>${sections}</article></div><div class="sticky noPrint"><button id="backReview" class="btn ghost">確認へ戻る</button><button id="pdfBtn" class="btn primary">PDFを作成</button></div>`;document.getElementById('backReview').onclick=renderReviewResults;document.getElementById('pdfBtn').onclick=createPDF}
async function pdfPair(name,b,a){const [bu,au]=await Promise.all([purl(b),purl(a)]);return `<div class="pdfPair"><div class="pdfCell"><div class="pdfCellLabel"><span>${esc(name)}</span><span>作業前</span></div><img src="${bu}"></div><div class="pdfCell"><div class="pdfCellLabel"><span>${esc(name)}</span><span>作業後</span></div><img src="${au}"></div></div>`}
async function createPDF(){const el=document.getElementById('pdf'),fn=`${current.propertyName}_${current.room}_${current.workDate}_報告書.pdf`.replace(/[\\/:*?"<>|]/g,'_'),b=document.getElementById('pdfBtn');if(typeof html2pdf!=='function'){window.print();return}b.disabled=true;b.textContent='作成中…';try{await html2pdf().set({margin:[7,7,7,7],filename:fn,image:{type:'jpeg',quality:.93},html2canvas:{scale:1.7,useCORS:true,logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(el).save();say('PDFを作成しました')}catch(e){console.error(e);say('PDF作成に失敗しました')}finally{b.disabled=false;b.textContent='PDFを作成'}}
async function openReport(id){current=await one(S.reports,id);if(!current)return;const p=await one(S.properties,current.propertyId);current.templateItems=current.templateItems||p?.items||current.items.map(i=>i.name);capture()}
async function deleteReport(id){if(!confirm('この作業データと写真を削除しますか？'))return;for(const p of await reportPhotos(id))await del(S.photos,p.id);await del(S.reports,id);home()}
async function templates(){const props=(await all(S.properties)).sort((a,b)=>a.name.localeCompare(b.name,'ja'));view.innerHTML=`<section class="card"><div class="between"><h2 class="sectionTitle">マンション設定</h2><button id="addP" class="btn primary small">＋追加</button></div><div class="help" style="margin-bottom:10px">マンションごとに作業項目テンプレートを保存します。項目追加は後からいつでも可能です。</div>${props.map(p=>`<div class="historyRow"><div><div class="historyTitle">${esc(p.name)}</div><div class="historySub">${(p.items||[]).map(esc).join(' ／ ')}</div></div><div class="row"><button class="btn ghost small editP" data-id="${p.id}">編集</button><button class="btn danger small delP" data-id="${p.id}">削除</button></div></div>`).join('')}</section>`;document.getElementById('addP').onclick=()=>propertyEdit();document.querySelectorAll('.editP').forEach(b=>b.onclick=()=>propertyEdit(b.dataset.id));document.querySelectorAll('.delP').forEach(b=>b.onclick=()=>deleteProperty(b.dataset.id))}
async function propertyEdit(id){const p=id?await one(S.properties,id):{id:uid('prop'),name:'',address:'',items:['基本清掃','家具家電対応','給水部品修理','台所床鳴り補修','玄関床CF']};view.innerHTML=`<section class="card"><h2 class="sectionTitle">${id?'マンション編集':'マンション追加'}</h2><div class="field"><label>マンション名</label><input id="pn" type="text" value="${esc(p.name)}"></div><div class="field" style="margin-top:10px"><label>住所（任意）</label><input id="pa" type="text" value="${esc(p.address||'')}"></div><div class="field" style="margin-top:10px"><label>作業項目（1行1項目）</label><textarea id="pi">${esc((p.items||[]).join('\n'))}</textarea><div class="help">「基本清掃」は特別項目として自動的に6か所へ展開します。</div></div><div class="sticky"><button id="pc" class="btn ghost">戻る</button><button id="ps" class="btn primary">保存</button></div></section>`;document.getElementById('pc').onclick=templates;document.getElementById('ps').onclick=async()=>{const name=document.getElementById('pn').value.trim();if(!name)return say('マンション名を入力してください');p.name=name;p.address=document.getElementById('pa').value.trim();p.items=[...new Set(document.getElementById('pi').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];p.updatedAt=nowISO();p.createdAt=p.createdAt||nowISO();await put(S.properties,p);templates()}}
async function deleteProperty(id){const reps=await all(S.reports);if(reps.some(r=>r.propertyId===id))return say('作業履歴があるため削除できません');if(confirm('このマンション設定を削除しますか？')){await del(S.properties,id);templates()}}
document.getElementById('homeBtn').onclick=home;window.addEventListener('beforeunload',revoke);
(async()=>{try{db=await openDB();await seed();await home()}catch(e){console.error(e);view.innerHTML='<section class="card"><h2>起動できませんでした</h2><p class="help">Safariの通常モードで開いてください。</p></section>'}})();
})();
</script>
</body>
