<script>
(()=>{'use strict';
const SUPA_URL='https://rcunbtgeketpvuxcnass.supabase.co';
const SUPA_KEY='sb_publishable_wt7G97Dn-kgbPC8gU1yw8Q_dVlAkREd';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const BASIC=['ベランダ','居室','台所','トイレ','風呂','玄関'];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID(); const now=()=>new Date().toISOString();
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const fmtDate=s=>s?new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'numeric',day:'numeric'}).format(new Date(s+'T00:00:00')):'';
const fmtTime=s=>s?new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(s)):'';
const toEmail=id=>`${String(id).trim().toLowerCase().replace(/[^a-z0-9._-]/g,'-')}@photo-report.local`;
function say(x){const toast=$('#toast');if(!toast)return;toast.textContent=x;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>{const t=$('#toast');if(t)t.classList.remove('show')},1800)}
let session=null,me=null,state={page:'home',filter:'all',query:'',current:null,props:[],workItems:[],reports:[],profiles:[],logs:[]};let qseq=0;
let signed=new Map(),aiModel=null,aiLoad=null;

// --- Offline queue -------------------------------------------------------
const ODB='photo-report-offline-v3'; let odb;
function openODB(){return new Promise((res,rej)=>{const r=indexedDB.open(ODB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('queue'))d.createObjectStore('queue',{keyPath:'id'});if(!d.objectStoreNames.contains('cache'))d.createObjectStore('cache',{keyPath:'key'})};r.onsuccess=()=>{odb=r.result;res()};r.onerror=()=>rej(r.error)})}
function os(n,m='readonly'){return odb.transaction(n,m).objectStore(n)}
function qPut(o){return new Promise((res,rej)=>{const r=os('queue','readwrite').put(o);r.onsuccess=()=>res(o);r.onerror=()=>rej(r.error)})}
function qAll(){return new Promise((res,rej)=>{const r=os('queue').getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>(a.order||0)-(b.order||0)));r.onerror=()=>rej(r.error)})}
function qDel(id){return new Promise((res,rej)=>{const r=os('queue','readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function cacheSet(key,value){if(!odb)return;return new Promise((res,rej)=>{const r=os('cache','readwrite').put({key,value,at:now()});r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function cacheGet(key){if(!odb)return null;return new Promise((res,rej)=>{const r=os('cache').get(key);r.onsuccess=()=>res(r.result?.value??null);r.onerror=()=>rej(r.error)})}
async function enqueue(type,payload,blob=null){await qPut({id:uuid(),type,payload,blob,createdAt:now(),order:Date.now()*1000+(qseq++%1000)});updateSyncBadge();}
async function updateSyncBadge(){const n=(await qAll()).length;const b=$('#syncBadge');if(b){b.textContent=n?`${n}件 同期待ち`:(navigator.onLine?'同期済み':'オフライン');b.classList.toggle('off',!navigator.onLine||!!n)}}
async function syncQueue(){if(!navigator.onLine||!session||!me?.active)return;const list=await qAll();for(const x of list){try{if(x.type==='insert'){const {error}=await sb.from(x.payload.table).insert(x.payload.data);if(error)throw error}else if(x.type==='update'){let q=sb.from(x.payload.table).update(x.payload.data);for(const [k,v] of Object.entries(x.payload.eq||{}))q=q.eq(k,v);const {error}=await q;if(error)throw error}else if(x.type==='delete'){let q=sb.from(x.payload.table).delete();for(const [k,v] of Object.entries(x.payload.eq||{}))q=q.eq(k,v);const {error}=await q;if(error)throw error}else if(x.type==='upload'){const {path,contentType}=x.payload;const {error}=await sb.storage.from('report-photos').upload(path,x.blob,{contentType,upsert:true});if(error)throw error}else if(x.type==='log'){const {error}=await sb.from('audit_logs').insert(x.payload);if(error)throw error}await qDel(x.id)}catch(e){console.warn('sync failed',x,e);break}}await updateSyncBadge();if(list.length)await loadCore(true)}
window.addEventListener('online',()=>{updateSyncBadge();syncQueue()});window.addEventListener('offline',updateSyncBadge);

async function dbInsert(table,data){if(navigator.onLine){const {error}=await sb.from(table).insert(data);if(!error)return;if(!String(error.message).includes('Failed to fetch'))throw error}await enqueue('insert',{table,data})}
async function dbUpdate(table,data,eq){if(navigator.onLine){let q=sb.from(table).update(data);for(const[k,v]of Object.entries(eq))q=q.eq(k,v);const {error}=await q;if(!error)return;if(!String(error.message).includes('Failed to fetch'))throw error}await enqueue('update',{table,data,eq})}
async function logAction(reportId,action,detail={}){const row={report_id:reportId,actor_id:me.id,action,detail,created_at:now()};if(navigator.onLine){const {error}=await sb.from('audit_logs').insert(row);if(!error)return}await enqueue('log',row)}

// --- Auth ---------------------------------------------------------------
async function bootstrapStatus(){try{const r=await fetch(`${SUPA_URL}/functions/v1/bootstrap-admin`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify({action:'status'})});return await r.json()}catch{return{initialized:true}}}
async function renderLogin(){const st=await bootstrapStatus();document.body.innerHTML=`<div id="app"></div><div id="toast" class="toast"></div>`;const a=$('#app');a.innerHTML=`<div class="loginWrap"><div class="loginCard"><div class="muted" style="font-size:11px;font-weight:900;letter-spacing:.12em">CO-OP CLEANING WORKFLOW</div><h1>清掃写真報告</h1><div class="help">IDとパスワードでログインします。IDは半角英数字・._- を使用します。</div><div class="field"><label>ログインID</label><input id="loginId" autocomplete="username" placeholder="例：tamura01"></div><div class="field"><label>パスワード</label><input id="loginPw" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary" style="width:100%;margin-top:14px">ログイン</button>${st.initialized?'':`<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"><div class="label">初回セットアップ</div><div class="help">最初の1名だけ管理者IDを作成できます。</div><button id="setupBtn" class="btn secondary" style="width:100%;margin-top:8px">初期管理者を登録</button></div>`}</div></div>`;$('#loginBtn').onclick=login;if($('#setupBtn'))$('#setupBtn').onclick=setupAdmin}
async function login(){const id=$('#loginId').value.trim(),pw=$('#loginPw').value; if(!id||!pw)return say('IDとパスワードを入力してください');const b=$('#loginBtn');b.disabled=true;b.textContent='ログイン中…';const {data,error}=await sb.auth.signInWithPassword({email:toEmail(id),password:pw});if(error){b.disabled=false;b.textContent='ログイン';return say('IDまたはパスワードを確認してください')}session=data.session;await afterAuth()}
async function setupAdmin(){const code=prompt('初期セットアップコード');if(!code)return;const id=prompt('管理者ID（半角英数字・._-、3文字以上）');if(!id)return;const pw=prompt('管理者パスワード（8文字以上）');if(!pw)return;const r=await fetch(`${SUPA_URL}/functions/v1/bootstrap-admin`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify({setup_code:code,login_id:id,password:pw})});const j=await r.json();if(!r.ok)return alert(j.error||'作成できませんでした');alert('管理者を作成しました。今のIDでログインしてください。');renderLogin()}
async function afterAuth(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(!session)return renderLogin();const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error||!data){await sb.auth.signOut();return renderLogin()}me=data;if(!me.active){document.body.innerHTML=`<div class="loginWrap"><div class="loginCard"><h1>アカウント停止中</h1><p class="help">このIDはまだ有効化されていないか、管理者により停止されています。</p><button class="btn ghost" id="out">ログアウト</button></div></div>`;$('#out').onclick=()=>sb.auth.signOut().then(renderLogin);return}if(me.role==='worker'&&!me.display_name)return firstName();await loadCore();renderShell()}
function firstName(){document.body.innerHTML=`<div class="loginWrap"><div class="loginCard"><h1>担当者名を登録</h1><p class="help">初回だけ入力します。次回以降は自動で担当者名として記録されます。</p><div class="field"><label>担当者名</label><input id="firstName" placeholder="例：田村 空丈"></div><button id="saveName" class="btn primary" style="width:100%;margin-top:14px">登録して開始</button></div></div>`;$('#saveName').onclick=async()=>{const name=$('#firstName').value.trim();if(!name)return say('名前を入力してください');const {data,error}=await sb.functions.invoke('set-my-name',{body:{display_name:name}});if(error||data?.error)return alert(data?.error||error.message);me.display_name=name;await loadCore();renderShell()}}

// --- Data ---------------------------------------------------------------
async function loadCore(force=false){if(!navigator.onLine){const c=await cacheGet('core');if(c){Object.assign(state,c);return}throw new Error('オフラインでキャッシュがありません')}const [p,w,r,pr]=await Promise.all([
 sb.from('properties').select('*').eq('active',true).order('name'),
 sb.from('work_items').select('id,name,kind,active,order_no,created_by,created_at,updated_at').eq('active',true).order('order_no'),
 sb.from('reports').select('*,properties(name,address),report_workers(user_id,profiles(display_name,login_id)),report_tasks(id,item_name,work_item_id,quantity,unit_price_snapshot,sort_no),completed:profiles!reports_completed_by_fkey(display_name,login_id),updatedby:profiles!reports_last_updated_by_fkey(display_name,login_id)').is('deleted_at',null).order('updated_at',{ascending:false}).limit(1500),
 me?.role==='admin'?sb.from('profiles').select('*').order('created_at'):Promise.resolve({data:[]})
 ]);if(p.error)throw p.error;if(w.error)throw w.error;if(r.error)throw r.error;state.props=p.data||[];state.workItems=w.data||[];state.reports=r.data||[];state.profiles=pr.data||[];await cacheSet('core',{props:state.props,workItems:state.workItems,reports:state.reports,profiles:state.profiles});await updateSyncBadge()}
const statusMeta=s=>({before:['作業前','s-before'],progress:['作業中','s-progress'],review:['要確認','s-review'],revisit:['要再訪','s-revisit'],done:['完了','s-done']}[s]||['未着手','s-none']);
const workerName=r=>{const x=(r.report_workers||[]).map(v=>v.profiles?.display_name||v.profiles?.login_id).filter(Boolean);return x.length?x.join('・'):'—'};
function reportMatch(r,q){q=q.trim().toLowerCase();if(!q)return true;const t=[r.properties?.name,r.room_no,r.work_date,r.status,statusMeta(r.status)[0],workerName(r),...(r.report_tasks||[]).map(x=>x.item_name)].join(' ').toLowerCase();return t.includes(q)}
function searchSummary(x){const ws=String(x.worker_names||'').split('・').filter(Boolean),ts=String(x.task_names||'').split(' / ').filter(Boolean);return {id:x.id,property_id:x.property_id,room_no:x.room_no,work_date:x.work_date,status:x.status,updated_at:x.updated_at,completed_at:x.completed_at,locked:x.locked,properties:{name:x.property_name||'',address:x.property_address||''},report_workers:ws.map(n=>({profiles:{display_name:n,login_id:n}})),report_tasks:ts.map((n,i)=>({id:'search-'+i,item_name:n,sort_no:i}))}}
async function serverSearchReports(q='',status='',date='',limit=300){if(!navigator.onLine)return state.reports.filter(r=>reportMatch(r,q)&&(!status||r.status===status)&&(!date||r.work_date===date)).slice(0,limit);let z=sb.from('report_search_index').select('*').order('updated_at',{ascending:false}).limit(limit);if(q.trim())z=z.ilike('search_text',`%${q.trim().toLowerCase()}%`);if(status)z=z.eq('status',status);if(date)z=z.eq('work_date',date);const {data,error}=await z;if(error)throw error;return (data||[]).map(searchSummary)}

async function importPropertiesCSV(file){if(!file)return;const text=await file.text();const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return;const parse=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out.map(x=>x.trim())};let rows=lines.map(parse);if(/マンション|物件|name/i.test(rows[0][0]||''))rows=rows.slice(1);const existing=new Set(state.props.map(p=>p.name.trim().toLowerCase()));const add=rows.filter(r=>r[0]&&!existing.has(r[0].trim().toLowerCase())).map(r=>({id:uuid(),name:r[0].trim(),address:(r[1]||'').trim(),active:true,created_by:me.id,created_at:now(),updated_at:now()}));if(!add.length)return say('追加対象がありません');if(!confirm(`${add.length}件のマンションを追加しますか？`))return;for(const row of add)await dbInsert('properties',row);state.props.push(...add);await logAction(null,'add_property',{bulk:true,count:add.length});await cacheSet('core',{props:state.props,workItems:state.workItems,reports:state.reports,profiles:state.profiles});say(`${add.length}件追加しました`);renderMasterEditor()}

async function editWorkItem(w){if(!w)return;const name=prompt('作業項目名',w.name);if(name===null||!name.trim())return;if(w.kind==='basic'&&name.trim()!=='基本清掃'&&!confirm('基本清掃テンプレートの名前を変更しますか？6部位構成は維持されます。'))return;await dbUpdate('work_items',{name:name.trim(),updated_at:now()},{id:w.id});await logAction(null,'edit_work_item',{work_item_id:w.id,name:name.trim()});w.name=name.trim();await cacheSet('core',{props:state.props,workItems:state.workItems,reports:state.reports,profiles:state.profiles});renderMasterEditor()}

async function renderHistory(){const v=$('#view');v.innerHTML=`<h2 style="margin-top:0">履歴</h2><div class="card"><input id="histSearch" class="search" placeholder="マンション・部屋番号（全履歴検索）"><div class="help" style="margin-top:6px">マンション → 部屋 → 日付の順で確認できます。検索時はサーバー上の全履歴を対象にします。</div></div><div id="histReports"></div><section class="card"><h3 class="sectionTitle">操作履歴</h3><div id="logList" class="timeline"><div class="help">読み込み中…</div></div></section>`;const drawRows=rs=>{const pg=new Map();for(const r of rs){const pn=r.properties?.name||'未分類';if(!pg.has(pn))pg.set(pn,new Map());const rooms=pg.get(pn);if(!rooms.has(r.room_no))rooms.set(r.room_no,[]);rooms.get(r.room_no).push(r)}$('#histReports').innerHTML=[...pg.entries()].map(([pn,rooms])=>`<details class="card" open><summary style="font-weight:900;cursor:pointer">${esc(pn)} <span class="muted" style="font-size:12px">${[...rooms.values()].reduce((n,a)=>n+a.length,0)}件</span></summary><div style="margin-top:10px">${[...rooms.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'ja',{numeric:true})).map(([room,arr])=>`<details class="item" open><summary style="font-weight:900;cursor:pointer">${esc(room)}号室 <span class="muted" style="font-size:11px">${arr.length}件</span></summary><div class="list" style="margin-top:8px">${arr.sort((a,b)=>b.work_date.localeCompare(a.work_date)).map(reportRow).join('')}</div></details>`).join('')}</div></details>`).join('')||'<div class="card help">履歴はありません。</div>';wireRows($('#histReports'))};drawRows(state.reports);let hs=0,ht;$('#histSearch').oninput=e=>{clearTimeout(ht);const q=e.target.value.trim();ht=setTimeout(async()=>{const s=++hs;if(!q)return drawRows(state.reports);$('#histReports').innerHTML='<div class="card help">全履歴を検索中…</div>';try{const rows=await serverSearchReports(q,'','',300);if(s===hs)drawRows(rows)}catch(err){if(s===hs)$('#histReports').innerHTML=`<div class="notice danger">${esc(err.message)}</div>`}},250)};const {data}=await sb.from('audit_logs').select('*,prof async function uploadPhoto(r,itemId,phase,file){if(!file)return;const old=photoFor(r,itemId,phase),pid=old?.id||uuid(),ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${r.id}/${itemId}/${phase}-${pid}.${ext}`;say('写真を保存中…');let localUrl='';try{localUrl=URL.createObjectURL(file)}catch{}if(navigator.onLine){const {error}=await sb.storage.from('report-photos').upload(path,file,{contentType:file.type||'image/jpeg',upsert:true});if(error){await enqueue('upload',{path,contentType:file.type||'image/jpeg'},file)}}else await enqueue('upload',{path,contentType:file.type||'image/jpeg'},file);const row={id:pid,report_item_id:itemId,phase,storage_path:path,original_name:file.name,captured_at:file.lastModified?new Date(file.lastModified).toISOString():null,uploaded_by:me.id,created_at:old?.created_at||now(),_url:localUrl};if(old)await dbUpdate('photos',{...row,_url:undefined},{id:pid});else await dbInsert('photos',{...row,_url:undefined});r.photos=[...r.photos.filter(x=>!(x.report_item_id===itemId&&x.phase===phase)),row];r.status=autoStatus(r);r.updated_at=now();r.last_updated_by=me.id;await dbUpdate('reports',{last_updated_by:me.id,updated_at:r.updated_at,status:r.status},{id:r.id});await logAction(r.id,'add_photo',{item_id:itemId,phase});signed.delete(pid);await cacheSet('report:'+r.id,r);navigator.onLine?openReport(r.id):renderReportEditor(r)}

async function loadAI(){if(aiModel)return aiModel;if(aiLoad)return aiLoad;aiLoad=(async()=>{const js=(src)=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});if(!window.tf)await js('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');if(!window.mobilenet)await js('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');return aiModel=await mobilenet.load()})();return aiLoad}
function expectedWords(zone){return{トイレ:['toilet','seat','bathroom'],風呂:['bathtub','shower','bathroom'],台所:['stove','oven','refrigerator','sink','kitchen'],玄関:['door','shoe','hall'],ベランダ:['patio','balcony','railing','outdoor'],居室:['room','bed','sofa','table','chair']}[zone]||[]}
function obviousOther(pred,zone){const txt=pred.map(x=>x.className.toLowerCase()).join(' ');const strong={トイレ:['toilet'],風呂:['bathtub','shower'],台所:['stove','oven','refrigerator'],玄関:['door'],ベランダ:['patio'],居室:['bed','sofa']};for(const[z,ws]of Object.entries(strong)){if(z!==zone&&ws.some(w=>txt.includes(w)))return z}return null}
async function visualSignature(url){const img=new Image();img.crossOrigin='anonymous';await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const c=document.createElement('canvas');c.width=12;c.height=12;const x=c.getContext('2d');x.drawImage(img,0,0,12,12);const d=x.getImageData(0,0,12,12).data,a=[];for(let i=0;i<d.length;i+=4)a.push(.299*d[i]+.587*d[i+1]+.114*d[i+2]);const m=a.reduce((s,v)=>s+v,0)/a.length;return a.map(v=>v-m)}
function signatureDiff(a,b){if(!a||!b||a.length!==b.length)return 0;return a.reduce((s,v,i)=>s+Math.abs(v-b[i]),0)/a.length}
async function runAI(r){say('AIモデルを読み込み中…');let model;try{model=await loadAI()}catch{return alert('AIチェックを読み込めませんでした。通信状況を確認してください。')}let n=0;for(const i of r.items){for(const ph of ['before','after']){const p=photoFor(r,i.id,ph);if(!p)continue;let warning=null;const u=await photoUrl(p);if(i.zone_name){const img=new Image();img.crossOrigin='anonymous';await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=u});const pred=await model.classify(img,5);const other=obviousOther(pred,i.zone_name);if(other)warning=`${i.zone_name}に登録されていますが、${other}の写真である可能性があります。`}if(ph==='after'){const bp=photoFor(r,i.id,'before');if(bp){try{const d=signatureDiff(await visualSignature(await photoUrl(bp)),await visualSignature(u));if(d>58)warning=(warning?warning+' ':'')+'作業前後で撮影構図が大きく異なる可能性があります。'}catch{}}}await dbUpdate('photos',{ai_warning:warning,ai_checked_at:now()},{id:p.id});p.ai_warning=warning;if(warning)n++}}r.status=n?'review':autoStatus(r);await dbUpdate('reports',{status:r.status,last_updated_by:me.id,updated_at:now()},{id:r.id});await logAction(r.id,'edit_report',{ai_check:true,warnings:n});await cacheSet('report:'+r.id,r);say(n?`${n}件を要確認にしました`:'明らかな違いは見つかりませんでした');openReport(r.id)}

告書').replace(/[\/:*?"<>|]/g,'_'),name=`${r.work_date}_${safe}_${r.room_no}号室_報告書.pdf`;if(window.html2pdf)html2pdf().set({margin:0,filename:name,image:{type:'jpeg',quality:.94},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from($('#paper')).save();else window.print()}}

// --- Admin -------------------------------------------------------------
async function renderAdmin(){if(me.role!=='admin')return go('home');const v=$('#view');v.innerHTML=`<div class="between"><h2 style="margin:0">管理画面</h2><button class="btn ghost small" id="aBack">ホーム</button></div><div class="tabs" style="margin:12px 0"><button class="tab active" data-at="users">ユーザー</button><button class="tab" data-at="masters">マンション・項目</button><button class="tab" data-at="money">発注金額</button><button class="tab" data-at="audit">全履歴</button><button class="tab" data-at="trash">ゴミ箱</button><button class="tab" data-at="export">出力</button></div><div id="adminBody"></div>`;$('#aBack').onclick=()=>go('home');$$('[data-at]').forEach(b=>b.onclick=()=>{$$('[data-at]').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawAdmin(b.dataset.at)});drawAdmin('users')}
async function adminInvoke(body){const {data,error}=await sb.functions.invoke('admin-users',{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data}
async function drawAdmin(tab){const b=$('#adminBody');if(tab==='users'){b.innerHTML='<div class="card">読み込み中…</div>';let users;try{users=(await adminInvoke({action:'list'})).users}catch(e){return b.innerHTML=`<div class="notice danger">${esc(e.message)}</div>`}b.innerHTML=`<section class="card"><div class="between"><h3 class="sectionTitle" style="margin:0">ユーザー管理</h3><button id="newUser" class="btn primary small">＋ユーザー</button></div><div class="list" style="margin-top:10px">${users.map(u=>`<div class="item"><div class="between"><div><div class="itemTitle">${esc(u.display_name||'(名前未登録)')}</div><div class="itemSub">ID: ${esc(u.login_id||'')} / ${u.role==='admin'?'管理者':'作業者'}</div></div><span class="status ${u.active?'s-done':'s-none'}">${u.active?'有効':'停止'}</span></div><div class="row" style="margin-top:8px"><button class="btn ghost small editUser" data-id="${u.id}" data-login="${esc(u.login_id||'')}" data-role="${u.role}" data-active="${u.active}">編集</button></div></div>`).join('')}</div></section>`;$('#newUser').onclick=createUser;$$('.editUser').forEach(x=>x.onclick=()=>editUser(x,users.find(u=>u.id===x.dataset.id)))}else if(tab==='masters'){let priceData={items:[]};try{priceData=await adminInvoke({action:'prices'})}catch(e){return b.innerHTML=`<div class="notice danger">${esc(e.message)}</div>`}const pm=new Map((priceData.items||[]).map(x=>[x.id,x.unit_price]));state.workItems.forEach(w=>w.unit_price=pm.has(w.id)?pm.get(w.id):null);b.innerHTML=`<div class="adminGrid"><section class="card"><div class="between"><h3 class="sectionTitle" style="margin:0">マンション ${state.props.length}件</h3><button class="btn secondary small" id="aAddProp">＋追加</button></div><input id="aPropQ" class="search" style="margin:9px 0" placeholder="検索"><div id="aProps" class="list"></div></section><section class="card"><div class="between"><h3 class="sectionTitle" style="margin:0">作業項目</h3><button class="btn secondary small" id="aAddWI">＋追加</button></div><div class="list" style="margin-top:9px">${state.workItems.map(w=>`<div class="item"><b>${esc(w.name)}</b><div class="itemSub">単価 ${w.unit_price==null?'未設定':Number(w.unit_price).toLocaleString()+'円'}</div><button class="btn ghost small priceEdit" data-id="${w.id}" style="margin-top:6px">単価設定</button></div>`).join('')}</div></section></div>`;const drawP=()=>{$('#aProps').innerHTML=state.props.filter(p=>p.name.includes($('#aPropQ').value)).slice(0,100).map(p=>`<div class="item"><b>${esc(p.name)}</b><div class="itemSub">${esc(p.address||'')}</div></div>`).join('')};$('#aPropQ').oninput=drawP;drawP();$('#aAddProp').onclick=addProperty;$('#aAddWI').onclick=addWorkItem;$$('.priceEdit').forEach(x=>x.onclick=async()=>{const w=state.workItems.find(y=>y.id===x.dataset.id);const p=prompt(`${w.name} の発注単価`,w.unit_price??'');if(p===null)return;const val=p===''?null:Number(p);try{await adminInvoke({action:'set_price',work_item_id:w.id,unit_price:val});w.unit_price=val;say('単価を更新しました');drawAdmin('masters')}catch(e){alert(e.message)}})}else if(tab==='money'){b.innerHTML='<div class="card">集計中…</div>';let fin;try{fin=await adminInvoke({action:'finance'})}catch(e){return b.innerHTML=`<div class="notice danger">${esc(e.message)}</div>`}const recent=(fin.rows||[]).slice(0,12);b.innerHTML=`<section class="card"><h3 class="sectionTitle">発注金額</h3><div class="kpiGrid"><div class="kpi"><b>${fin.count||0}</b><span>完了件数</span></div><div class="kpi"><b>¥${Number(fin.total||0).toLocaleString()}</b><span>発注金額合計</span></div></div><div class="notice" style="margin-top:10px">案件作成時の単価を固定保存するため、後から単価を変更しても過去の金額は変わりません。</div></section><section class="card"><h3 class="sectionTitle">最近の完了</h3><div class="list">${recent.map(r=>`<div class="item"><div class="between"><div><b>${esc(r.properties?.name||'')} ${esc(r.room_no)}号室</b><div class="itemSub">${fmtDate(r.work_date)} / ${esc((r.workers||[]).join('・'))}</div></div><b>¥${Number(r.amount||0).toLocaleString()}</b></div></div>`).join('')||'<div class="help">完了案件はありません。</div>'}</div></section>`}else if(tab==='audit'){const {data}=await sb.from('audit_logs').select('*,profiles(display_name,login_id),reports(room_no,work_date,properties(name))').order('created_at',{ascending:false}).limit(500);b.innerHTML=`<section class="card"><h3 class="sectionTitle">全操作履歴</h3><div class="timeline">${(data||[]).map(l=>`<div class="event"><b>${esc(actionLabel(l.action))}</b><div>${fmtTime(l.created_at)}・${esc(l.profiles?.display_name||l.profiles?.login_id||'')}</div><div>${esc(l.reports?.properties?.name||'')} ${esc(l.reports?.room_no||'')}</div></div>`).join('')}</div></section>`}else if(tab==='trash'){const [rr,pp]=await Promise.all([sb.from('reports').select('id,room_no,work_date,deleted_at,properties(name)').not('deleted_at','is',null).order('deleted_at',{ascending:false}).limit(100),sb.from('photos').select('id,report_item_id,phase,storage_path,deleted_at,report_items(report_id,zone_name,item_name,reports(room_no,properties(name)))').not('deleted_at','is',null).order('deleted_at',{ascending:false}).limit(100)]);b.innerHTML=`<section class="card"><h3 class="sectionTitle">案件ゴミ箱</h3><div class="list">${(rr.data||[]).map(x=>`<div class="item"><b>${esc(x.properties?.name||'')} ${esc(x.room_no)}号室</b><div class="itemSub">${fmtDate(x.work_date)} / 削除 ${fmtTime(x.deleted_at)}</div><button class="btn secondary small restoreReport" data-id="${x.id}" style="margin-top:6px">復元</button></div>`).join('')||'<div class="help">空です</div>'}</div></section><section class="card"><h3 class="sectionTitle">写真ゴミ箱</h3><div class="list">${(pp.data||[]).map(x=>`<div class="item"><b>${esc(x.report_items?.reports?.properties?.name||'')} ${esc(x.report_items?.reports?.room_no||'')}号室</b><div class="itemSub">${esc(x.report_items?.zone_name||x.report_items?.item_name||'')} / ${x.phase==='before'?'作業前':'作業後'} / 削除 ${fmtTime(x.deleted_at)}</div><button class="btn secondary small restorePhoto" data-id="${x.id}" style="margin-top:6px">復元</button></div>`).join('')||'<div class="help">空です</div>'}</div></section>`;$$('.restoreReport').forEach(x=>x.onclick=async()=>{await dbUpdate('reports',{deleted_at:null,deleted_by:null,updated_at:now()},{id:x.dataset.id});await logAction(x.dataset.id,'restore_report',{});await loadCore(true);drawAdmin('trash')});$$('.restorePhoto').forEach(x=>x.onclick=async()=>{const ph=(pp.data||[]).find(y=>y.id===x.dataset.id);await dbUpdate('photos',{deleted_at:null,deleted_by:null},{id:x.dataset.id});await logAction(ph?.report_items?.report_id||null,'restore_photo',{photo_id:x.dataset.id});drawAdmin('trash')})}else if(tab==='export'){b.innerHTML=`<section class="card"><h3 class="sectionTitle">データ出力</h3><div class="grid2"><div class="field"><label>開始日</label><input id="exFrom" type="date"></div><div class="field"><label>終了日</label><input id="exTo" type="date"></div></div><div class="field" style="margin-top:8px"><label>マンション（空欄=全部）</label><input id="exProp" placeholder="検索文字"></div><div class="row" style="margin-top:10px"><button id="csvBtn" class="btn primary">CSV</button><button id="jsonBtn" class="btn secondary">バックアップJSON</button><button id="zipBtn" class="btn secondary">報告書PDF ZIP</button></div><div class="notice" style="margin-top:9px">日付・マンションで絞り込んで一括出力できます。PDF ZIPは件数が多いとiPhoneで時間がかかります。</div></section>`;$('#csvBtn').onclick=exportCSV;$('#jsonBtn').onclick=exportJSON;$('#zipBtn').onclick=exportPdfZip}}

function exportFilteredReports(){const f=$('#exFrom')?.value||'',t=$('#exTo')?.value||'',q=($('#exProp')?.value||'').trim().toLowerCase();return state.reports.filter(r=>r.status==='done'&&(!f||r.work_date>=f)&&(!t||r.work_date<=t)&&(!q||(r.properties?.name||'').toLowerCase().includes(q)))}
async function exportCSV(){try{const fin=await adminInvoke({action:'finance',from:$('#exFrom')?.value||null,to:$('#exTo')?.value||null,property_query:$('#exProp')?.value||''});const rows=(fin.rows||[]).map(r=>[r.work_date,r.properties?.name||'',r.room_no,(r.workers||[]).join('・'),(r.report_tasks||[]).map(x=>x.item_name).join(' / '),r.amount||0,r.completed_at||'']);const head=['作業日','マンション','部屋','担当者','作業項目','発注金額','完了日時'];const csv=[head,...rows].map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`作業報告_${today()}.csv`)}catch(e){alert(e.message)}}
async function exportJSON(){try{const fin=await adminInvoke({action:'finance',from:$('#exFrom')?.value||null,to:$('#exTo')?.value||null,property_query:$('#exProp')?.value||''});const data={exported_at:now(),count:fin.count,total:fin.total,reports:fin.rows||[]};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`作業報告バックアップ_${today()}.json`)}catch(e){alert(e.message)}}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function ensureJSZip(){if(window.JSZip)return;await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportDetail(id){const q=await sb.from('reports').select('*,properties(name,address),report_workers(user_id,profiles(display_name,login_id)),report_tasks(*)').eq('id',id).single();if(q.error)throw q.error;const r=q.data,{data:i}=await sb.from('report_items').select('*').eq('report_id',id).order('sort_no');const {data:p}=await sb.from('photos').select('*').in('report_item_id',(i||[]).map(x=>x.id)).is('deleted_at',null);r.items=i||[];r.photos=p||[];for(const ph of r.photos)ph._url=await photoUrl(ph);return r}
function pdfNode(r){const el=document.createElement('div');el.className='paper';el.style.position='fixed';el.style.left='-10000px';el.style.top='0';el.style.width='794px';const tasks=[...(r.report_tasks||[])].sort((a,b)=>(a.sort_no||0)-(b.sort_no||0));const sections=tasks.map(t=>{const its=(r.items||[]).filter(i=>i.task_id===t.id).sort((a,b)=>(a.sort_no||0)-(b.sort_no||0));return `<section style="margin-top:14px"><div style="font-size:15px;font-weight:900;background:#eef2f5;border-left:4px solid #1c3c50;padding:6px 8px;margin-bottom:7px">${esc(t.item_name)}</div>${its.map(i=>{const b=photoFor(r,i.id,'before'),a=photoFor(r,i.id,'after'),label=i.zone_name||i.item_name;return `<div class="pdfPair"><div class="pdfCell"><b>${esc(label)}　作業前</b><img src="${b?b._url||'':''}"></div><div class="pdfCell"><b>${esc(label)}　作業後</b><img src="${a?a._url||'':''}"></div></div>`}).join('')}</section>`}).join('');el.innerHTML=`<div class="pdfTitle">作業報告書</div><div class="pdfMeta"><div><b>マンション：</b>${esc(r.properties?.name||'')}</div><div><b>部屋：</b>${esc(r.room_no)}号室</div><div><b>作業日：</b>${fmtDate(r.work_date)}</div><div><b>担当：</b>${esc(workerName(r))}</div></div>${sections}`;document.body.appendChild(el);return el}
async function waitImages(el){await Promise.all([...el.querySelectorAll('img')].map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res})))}
async function exportPdfZip(){const rows=exportFilteredReports();if(!rows.length)return say('対象の報告書がありません');if(rows.length>60&&!confirm(`${rows.length}件あります。iPhoneでは時間がかかる可能性があります。続けますか？`))return;try{await ensureJSZip();const zip=new JSZip();let i=0;for(const x of rows){i++;say(`PDF作成 ${i}/${rows.length}`);const r=await exportDetail(x.id),el=pdfNode(r);await waitImages(el);const blob=await html2pdf().set({margin:0,image:{type:'jpeg',quality:.92},html2canvas:{scale:1.4,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(el).toPdf().outputPdf('blob');el.remove();const safe=(r.properties?.name||'報告書').replace(/[\\/:*?"<>|]/g,'_'),room=String(r.room_no||'').replace(/[\\/:*?"<>|]/g,'_');zip.file(`${safe}/${r.work_date}/${room}号室_報告書.pdf`,blob)}const out=await zip.generateAsync({type:'blob'});downloadBlob(out,`報告書一括_${today()}.zip`);say('ZIPを作成しました')}catch(e){alert('一括PDF作成に失敗しました：'+e.message)}}
async function createUser(){const id=prompt('ログインID');if(!id)return;const pw=prompt('初期パスワード（8文字以上）');if(!pw)return;const admin=confirm('管理者として作成しますか？\nOK=管理者 / キャンセル=作業者');const name=admin?'':prompt('担当者名（空欄なら初回ログイン時に本人が入力）')||'';try{await adminInvoke({action:'create',login_id:id,password:pw,role:admin?'admin':'worker',display_name:name});say('ユーザーを作成しました');drawAdmin('users')}catch(e){alert(e.message)}}
async function editUser(el,u){const x=prompt(`1: 有効/停止\n2: 権限切替\n3: パスワード変更\n4: 名前変更\n5: ログインID変更`);try{if(x==='1')await adminInvoke({action:'update',user_id:u.id,active:!u.active});else if(x==='2')await adminInvoke({action:'update',user_id:u.id,role:u.role==='admin'?'worker':'admin'});else if(x==='3'){const p=prompt('新しいパスワード（8文字以上）');if(p)await adminInvoke({action:'update',user_id:u.id,password:p})}else if(x==='4'){const n=prompt('名前',u.display_name||'');if(n!==null)await adminInvoke({action:'update',user_id:u.id,display_name:n})}else if(x==='5'){const id=prompt('新しいID',u.login_id||'');if(id)await adminInvoke({action:'update',user_id:u.id,login_id:id})}else return;drawAdmin('users')}catch(e){alert(e.message)}}

// --- Init ---------------------------------------------------------------
async function init(){await openODB();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});const {data:{session:s}}=await sb.auth.getSession();session=s;if(session)await afterAuth();else await renderLogin()}
sb.auth.onAuthStateChange((ev,s)=>{session=s;if(ev==='SIGNED_OUT')renderLogin()});init().catch(e=>{console.error(e);document.body.innerHTML=`<div class="loginWrap"><div class="loginCard"><h1>起動エラー</h1><div class="notice danger">${esc(e.message)}</div><button class="btn ghost" onclick="location.reload()" style="margin-top:10px">再読み込み</button></div></div>`});
})();
</script>
